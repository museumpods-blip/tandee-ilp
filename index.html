<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tandee Layer Prototype</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: #ffffff;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: linear-gradient(180deg, #09182b, #03070d);
    padding: 16px;
  }

  .header {
    text-align: center;
    padding: 14px 0 18px;
  }

  .logo {
    font-size: 28px;
    font-weight: bold;
    color: #f6c04d;
  }

  .tagline {
    font-size: 14px;
    color: #b9c6d6;
    margin-top: 6px;
  }

  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }

  label {
    font-size: 13px;
    color: #cfd8e3;
    display: block;
    margin-bottom: 8px;
  }

  input, textarea, select {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 13px;
    font-size: 15px;
    background: #ffffff;
    color: #111;
    outline: none;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
  }

  .modes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 12px;
  }

  .mode {
    padding: 13px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  .mode.active {
    background: #f6c04d;
    color: #07111f;
    font-weight: bold;
  }

  button {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 15px;
    margin-top: 14px;
    background: #f6c04d;
    color: #07111f;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }

  button.secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .output {
    display: none;
  }

  .section-title {
    color: #f6c04d;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .pill {
    background: rgba(246,192,77,0.16);
    border: 1px solid rgba(246,192,77,0.35);
    color: #f7d88a;
    padding: 8px 10px;
    border-radius: 999px;
    font-size: 13px;
  }

  .item {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    line-height: 1.45;
  }

  .item:last-child {
    border-bottom: none;
  }

  .footer-note {
    font-size: 12px;
    color: #8fa1b7;
    text-align: center;
    padding: 18px 8px;
  }

  .saved {
    font-size: 13px;
    color: #9ee6b0;
    margin-top: 10px;
    display: none;
  }
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="logo">Tandee Layer</div>
    <div class="tagline">An immersive AI-assisted mobile experience</div>
  </div>

  <div class="card">
    <label>Paste a URL or describe what you are looking at</label>
    <input id="urlInput" placeholder="Example: YouTube video, article, recruit page, local business..." />

    <br><br>

    <label>Optional page notes or copied text</label>
    <textarea id="contentInput" placeholder="Paste text here, or describe the page..."></textarea>

    <div class="modes">
      <div class="mode active" onclick="setMode('General', this)">General</div>
      <div class="mode" onclick="setMode('Scout', this)">Scout</div>
      <div class="mode" onclick="setMode('Lens', this)">Lens</div>
      <div class="mode" onclick="setMode('Local', this)">Local</div>
    </div>

    <button onclick="analyze()">Generate Tandee Layer</button>
  </div>

  <div id="output" class="output">

    <div class="card">
      <div class="section-title">Context Snapshot</div>
      <div id="summary" class="item"></div>
      <div class="pill-row" id="pills"></div>
    </div>

    <div class="card">
      <div class="section-title">What Matters</div>
      <div id="keyPoints"></div>
    </div>

    <div class="card">
      <div class="section-title">Suggested Actions</div>
      <div id="actions"></div>
      <button class="secondary" onclick="saveWorkspace()">Save Workspace</button>
      <div id="savedMsg" class="saved">Workspace saved on this device.</div>
    </div>

    <div class="card">
      <div class="section-title">Ask Tandee</div>
      <input id="askInput" placeholder="Ask a question about this page..." />
      <button onclick="askTandee()">Ask</button>
      <div id="answer" class="item" style="margin-top:12px;"></div>
    </div>

  </div>

  <div class="footer-note">
    Prototype only. No data leaves this device yet.
  </div>

</div>

<script>
let currentMode = "General";

function setMode(mode, element) {
  currentMode = mode;
  document.querySelectorAll(".mode").forEach(btn => btn.classList.remove("active"));
  element.classList.add("active");
}

function analyze() {
  const url = document.getElementById("urlInput").value.trim();
  const content = document.getElementById("contentInput").value.trim();

  const source = url || content || "an unknown mobile page";

  document.getElementById("output").style.display = "block";
  document.getElementById("savedMsg").style.display = "none";

  let summary = "";
  let pills = [];
  let keyPoints = [];
  let actions = [];

  if (currentMode === "Scout") {
    summary = "Tandee is treating this as a sports intelligence page and building a mobile scout workspace around it.";
    pills = ["Player context", "Strengths", "Risk", "Fit", "Comparison"];
    keyPoints = [
      "Identify the athlete, team, position, class year, and available statistics.",
      "Separate actual evidence from hype, rankings, and promotional language.",
      "Look for upside, readiness, athletic profile, and possible development risk."
    ];
    actions = [
      "Build a scout brief.",
      "Compare this player to another saved prospect.",
      "Save to My Scout Board.",
      "Generate a short recruiting article."
    ];
  }

  else if (currentMode === "Lens") {
    summary = "Tandee is treating this as investigative media and converting it into a structured case-analysis workspace.";
    pills = ["Timeline", "Anomalies", "People", "Evidence", "Questions"];
    keyPoints = [
      "Pull out the central claim or event being discussed.",
      "Identify names, places, dates, contradictions, and unusual details.",
      "Separate confirmed facts from speculation or commentary."
    ];
    actions = [
      "Build a case timeline.",
      "List key anomalies.",
      "Create a next-episode deep dive angle.",
      "Save this to an investigation thread."
    ];
  }

  else if (currentMode === "Local") {
    summary = "Tandee is treating this as a local discovery or mobile decision page.";
    pills = ["Nearby", "Directions", "Offer", "Event", "Share"];
    keyPoints = [
      "Determine whether this page is about a business, event, destination, or offer.",
      "Extract location, hours, cost, contact info, and next useful step.",
      "Turn the page into a simple mobile action flow."
    ];
    actions = [
      "Create a visitor card.",
      "Generate a QR-friendly promo.",
      "Open directions.",
      "Draft a local social post."
    ];
  }

  else {
    summary = "Tandee is reading this as a general web page and turning it into a mobile action layer.";
    pills = ["Summary", "Intent", "Actions", "Notes", "Next step"];
    keyPoints = [
      "Understand what this page is mainly about.",
      "Identify what the user is probably trying to do next.",
      "Convert passive browsing into an active workspace."
    ];
    actions = [
      "Summarize the page.",
      "Extract important details.",
      "Create notes.",
      "Recommend next actions."
    ];
  }

  document.getElementById("summary").innerText = summary + "\n\nSource: " + source;

  document.getElementById("pills").innerHTML = pills.map(p => `<div class="pill">${p}</div>`).join("");

  document.getElementById("keyPoints").innerHTML = keyPoints.map(p => `<div class="item">${p}</div>`).join("");

  document.getElementById("actions").innerHTML = actions.map(a => `<div class="item">${a}</div>`).join("");
}

function askTandee() {
  const question = document.getElementById("askInput").value.trim();

  if (!question) {
    document.getElementById("answer").innerText = "Ask me what you want to do with this page.";
    return;
  }

  document.getElementById("answer").innerText =
    "Prototype answer: Tandee would use the current page, selected mode, saved context, and your question to generate a focused response. Current mode: " + currentMode + ".";
}

function saveWorkspace() {
  const workspace = {
    mode: currentMode,
    url: document.getElementById("urlInput").value,
    content: document.getElementById("contentInput").value,
    savedAt: new Date().toISOString()
  };

  localStorage.setItem("tandee_workspace", JSON.stringify(workspace));
  document.getElementById("savedMsg").style.display = "block";
}
</script>

</body>
</html>
