<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tandee</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#030711;
  color:white;
}

.app{
  max-width:500px;
  margin:0 auto;
  min-height:100vh;
  padding:16px 16px 90px;
  background:linear-gradient(180deg,#0b1d34,#030711);
}

.header{
  text-align:center;
  padding:14px 0;
}

.logo{
  font-size:34px;
  font-weight:900;
  color:#f6c04d;
}

.tagline{
  font-size:14px;
  color:#b9c6d6;
  margin-top:6px;
}

.card{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.hero{
  font-size:22px;
  font-weight:800;
  line-height:1.2;
  margin-bottom:8px;
}

.sub{
  color:#b9c6d6;
  font-size:14px;
  line-height:1.45;
}

label{
  font-size:13px;
  color:#cfd8e3;
  display:block;
  margin-bottom:8px;
}

input,textarea{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.modes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.mode{
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.09);
  color:white;
  padding:13px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
}

.mode.active{
  background:#f6c04d;
  color:#07111f;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  margin-top:14px;
  background:#f6c04d;
  color:#07111f;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.section-title{
  color:#f6c04d;
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.pill{
  background:rgba(246,192,77,.16);
  border:1px solid rgba(246,192,77,.35);
  color:#f7d88a;
  padding:8px 10px;
  border-radius:999px;
  font-size:13px;
}

.anticipate{
  background:rgba(246,192,77,.09);
  border:1px solid rgba(246,192,77,.25);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
  line-height:1.45;
  font-size:14px;
}

.item{
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  line-height:1.45;
  font-size:14px;
}

.item:last-child{
  border-bottom:0;
}

.loading{
  color:#f6c04d;
  font-size:14px;
  padding:10px 0;
}

.error{
  color:#ffb4b4;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="logo">Tandee</div>
    <div class="tagline">AI-centered mobile interaction</div>
  </div>

  <div class="card">
    <div class="hero">Tandee anticipates what humans probably need next.</div>
    <div class="sub">
      Tandee focuses on situations, timing, friction, logistics, and next moves.
    </div>
  </div>

  <div class="card">
    <label>Choose Tandee layer</label>

    <div class="modes">
      <div class="mode active" onclick="setMode('General',this)">General</div>
      <div class="mode" onclick="setMode('Scout',this)">Scout</div>
      <div class="mode" onclick="setMode('Lens',this)">Lens</div>
      <div class="mode" onclick="setMode('Learn',this)">Learn</div>
    </div>

    <br>

    <label>What are you doing?</label>
    <input id="context" placeholder="Example: Flying from rural PA for a 6am flight">

    <br><br>

    <label>Extra notes</label>
    <textarea id="notes" placeholder="Example: Need parking, worried Uber may not exist, traveling with parents..."></textarea>

    <button onclick="runTandee()">Start Tandee</button>
  </div>

  <div class="card">
    <div class="section-title">Situation</div>
    <div id="summary">No active session.</div>
    <div id="pills" class="pills"></div>
  </div>

  <div class="card">
    <div class="section-title">Tandee Anticipates</div>
    <div id="anticipates"></div>
  </div>

  <div class="card">
    <div class="section-title">What Matters</div>
    <div id="points"></div>
  </div>

  <div class="card">
    <div class="section-title">Suggested Next Moves</div>
    <div id="actions"></div>
  </div>

</div>

<script>
const TANDEE_FUNCTION_URL = "https://pdhxtpgtzxjkgwabgybb.supabase.co/functions/v1/tandee-ai";

let currentMode = "General";

function setMode(mode, element){
  currentMode = mode;
  document.querySelectorAll(".mode").forEach(m => m.classList.remove("active"));
  element.classList.add("active");
}

async function runTandee(){

  const context = document.getElementById("context").value.trim();
  const notes = document.getElementById("notes").value.trim();

  document.getElementById("summary").innerHTML = '<div class="loading">Tandee is thinking through the situation...</div>';
  document.getElementById("pills").innerHTML = "";
  document.getElementById("anticipates").innerHTML = "";
  document.getElementById("points").innerHTML = "";
  document.getElementById("actions").innerHTML = "";

  const prompt = `
You are Tandee.

You are an AI-centered mobile interaction assistant.

Your job is NOT to give generic summaries.
Your job is to anticipate what a human probably needs next.

Think about:
- the user's actual situation
- timing
- stress
- logistics
- hidden friction
- rural vs urban realities
- cost
- reliability
- safety
- practical next steps
- what the user may not know to ask yet

Current Tandee layer: ${currentMode}

Situation:
${context}

Extra notes:
${notes}

Return ONLY valid JSON in this exact format:

{
  "summary":"short situation summary",
  "pills":["pill","pill","pill","pill"],
  "anticipates":[
    "anticipation 1",
    "anticipation 2",
    "anticipation 3",
    "anticipation 4"
  ],
  "points":[
    "important point 1",
    "important point 2",
    "important point 3"
  ],
  "actions":[
    "action 1",
    "action 2",
    "action 3"
  ]
}
`;

  try {

    const response = await fetch(TANDEE_FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    console.log("Supabase function response:", data);

    if (data.error) {
  throw new Error(JSON.stringify(data.error));
}

    const message = data.choices?.[0]?.message?.content;

    if (!message) {
      throw new Error("No AI message returned. Check Supabase function and OpenAI secret.");
    }

    const cleaned = message
      .replace(/```json/g, "")
      .replace(/```/g, "")
      .trim();

    const parsed = JSON.parse(cleaned);

    document.getElementById("summary").innerText = parsed.summary || "No summary returned.";

    document.getElementById("pills").innerHTML =
      (parsed.pills || []).map(p => `<div class="pill">${escapeHtml(p)}</div>`).join("");

    document.getElementById("anticipates").innerHTML =
      (parsed.anticipates || []).map(a => `
        <div class="anticipate">${escapeHtml(a)}</div>
      `).join("");

    document.getElementById("points").innerHTML =
      (parsed.points || []).map(p => `<div class="item">${escapeHtml(p)}</div>`).join("");

    document.getElementById("actions").innerHTML =
      (parsed.actions || []).map(a => `<div class="item">${escapeHtml(a)}</div>`).join("");

  } catch(error) {

    document.getElementById("summary").innerHTML =
      `<div class="error">Tandee could not generate a response.<br><br>${escapeHtml(error.message)}</div>`;

    document.getElementById("anticipates").innerHTML =
      `<div class="anticipate">Check that your Supabase Edge Function is deployed and your OPENAI_API_KEY secret is saved.</div>`;
  }
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
